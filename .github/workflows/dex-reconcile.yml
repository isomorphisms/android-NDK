name: Canonical checked DEX and JNI
on:
  pull_request:
    paths: ['dex/idric/**', 'examples/autogenerated/**', '.github/workflows/dex-reconcile.yml']
  push:
    branches: [main, dex/reconcile-icu]
    paths: ['dex/idric/**', 'examples/autogenerated/**', '.github/workflows/dex-reconcile.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  checked-dex:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ASAN_OPTIONS: detect_leaks=0
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/Idric
          ref: 740bbf2b1d9e811fd00c719c3473eede17ceea3b
          path: .tools/Idric
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/ai-ci
          ref: 1f2a88cb118e5fdcc9800a56c448da51759773a2
          path: .tools/ai-ci
          persist-credentials: false
      - name: Qualify pinned ICK for host native bootstrap stages
        id: ick
        uses: isomorphisms/ai-ci/ick-host@32cb45b3a3a257aeb07881c75f3b846495cfb2c9
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/ib
          ref: 8b6a1694ffb168f5e206262eeee89830d0733194
          path: .tools/ib-material
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/ib
          ref: 59716dabd375f0d49b8fb67a18dfd604b33a923a
          path: .tools/ib-source
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: dilapidated-shed/icu
          ref: b1c19dc281e5e7d3d326c9275093fb379bafd4bd
          path: .tools/icu
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/ib
          ref: dcbd86c0f7a69c4e0b381c0ab53f7c41f9966900
          path: .tools/ib-search
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/ib
          ref: 59716dabd375f0d49b8fb67a18dfd604b33a923a
          path: .tools/ib-reader
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/Idric-Net
          ref: b21801b72acb8ab835c297bbe298af8599550134
          path: .tools/Idric-Net
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: openssl/openssl
          ref: f4dc4d58b48d346a8270183f89acf826d459b0ca
          path: .tools/openssl
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/ai-ci
          ref: bd834cd7ac965f050493c072f83f221c4b400dd3
          path: .tools/icu-observer
          persist-credentials: false
      # Minimal fixed host provisioning before the compiled Grease is available.
      - name: Provision immutable compiled Grease and its original launcher
        shell: sh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/grease/bin"
          gh api repos/dilapidated-shed/grease/actions/artifacts/12702465664/zip > "$RUNNER_TEMP/grease.zip"
          printf '%s  %s\n' 6296b49206d5b9e16e2c30c49384dc7c86396f389dc2a5b013588a4f432dadbe "$RUNNER_TEMP/grease.zip" | sha256sum -c -
          unzip -p "$RUNNER_TEMP/grease.zip" _bin/cxx-asan/ysh > "$RUNNER_TEMP/grease/bin/ysh"
          curl -fL https://github.com/dilapidated-shed/grease/releases/download/tablet-aarch64-9b3dc8904891/grease-aarch64-termux.tar.gz -o "$RUNNER_TEMP/launcher.tar.gz"
          printf '%s  %s\n' 3ddb962ef313e528e525fa03518f494577e921c2201ecb49f7a11f2fbf4e82b2 "$RUNNER_TEMP/launcher.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/launcher.tar.gz" -C "$RUNNER_TEMP/grease" ./bin/grease
          printf '%s  %s\n' 7e31cd05b7a9d8fb2a4a9e003a7f3fcb0159138506d17f0fb28da8cbe22aa85c "$RUNNER_TEMP/grease/bin/ysh" | sha256sum -c -
          chmod 755 "$RUNNER_TEMP/grease/bin/ysh"
          printf '%s\n' "$RUNNER_TEMP/grease/bin" >> "$GITHUB_PATH"
      - name: Restore only the exact pinned frontend bootstrap
        id: frontend_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          key: idric-740bbf2b1d9e811fd00c719c3473eede17ceea3b-ick-32cb45b3a3a257aeb07881c75f3b846495cfb2c9-ubuntu24-x86_64-v1
          path: |
            .tools/Idric/_/.tools
            .tools/Idric/_/bootstrap-build
            .tools/Idric/_/build
      - name: Build pinned checked frontend with explicit host C compiler
        if: steps.frontend_cache.outputs.cache-hit != 'true'
        shell: sh
        env:
          CC: ${{ steps.ick.outputs.compiler }} -fno-link-libatomic
        run: .tools/Idric/edric bootstrap
      - name: Retain the exact frontend before consumer package installation
        if: steps.frontend_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          key: ${{ steps.frontend_cache.outputs.cache-primary-key }}
          path: |
            .tools/Idric/_/.tools
            .tools/Idric/_/bootstrap-build
            .tools/Idric/_/build
      - name: Install the pinned Android parser and NDK
        shell: sh
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0" "ndk;27.2.12479018"'
      - name: Provision ripgrep required by the pinned source and metadata tests
        shell: sh
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ripgrep
          fi
          command -v rg
          rg --version | head -n 1
      - name: Build canonical package and run host/source regressions serially
        shell: sh
        run: grease dex/idric/prepare-reconcile.grease "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.tools/Idric" "$ANDROID_HOME" "$RUNNER_TEMP/dex-evidence"
      - name: Reconcile Material construction and lifecycle source without changing IB
        shell: sh
        run: grease examples/autogenerated/framework-construction/verify.grease "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.tools/Idric" "$GITHUB_WORKSPACE/dex/idric/build/exec/idric-dex" "$GITHUB_WORKSPACE/dex/idric/build/ttc" "$GITHUB_WORKSPACE/.tools/ib-material" "$RUNNER_TEMP/dex-evidence/oracles/baksmali.jar" "$RUNNER_TEMP/dex-evidence/construction"
      - name: Qualify checked new-Intent source and independent decoded effects
        shell: sh
        run: |
          "$RUNNER_TEMP/grease/bin/grease" examples/autogenerated/new-intent/verify.grease "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.tools/Idric" "$RUNNER_TEMP/dex-evidence/oracles/baksmali.jar" "$RUNNER_TEMP/dex-evidence/new-intent" "$RUNNER_TEMP/grease/bin/grease"
          "$RUNNER_TEMP/grease/bin/grease" examples/autogenerated/new-intent/verify-independent.grease "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.tools/Idric" "$GITHUB_WORKSPACE/.tools/ai-ci" "$RUNNER_TEMP/dex-evidence/oracles/baksmali.jar" "$RUNNER_TEMP/dex-evidence/new-intent" "$RUNNER_TEMP/dex-evidence/new-intent-independent" "$RUNNER_TEMP/grease/bin/grease"
      - name: Qualify unchanged pure Text source export and source refusals
        shell: sh
        run: grease examples/autogenerated/pure-text-export/verify.grease "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.tools/Idric" "$GITHUB_WORKSPACE/.tools/ib-source" "$RUNNER_TEMP/dex-evidence/oracles/baksmali.jar" "$RUNNER_TEMP/dex-evidence/oracles/smali.jar" "$RUNNER_TEMP/dex-evidence/pure-text"
      - name: Compile independent observer and deliberately wrong checked helper
        shell: sh
        env:
          IDRIS2_PREFIX: ${{ github.workspace }}/.tools/Idric/_/bootstrap-build
          IDRIS2_PACKAGE_PATH: ${{ github.workspace }}/.tools/Idric/_/bootstrap-build/idris2-0.8.0
          IDRIS2_PATH: ${{ github.workspace }}/dex/idric/build/ttc
        run: grease dex/idric/prepare-art.grease "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.tools/ai-ci" "$GITHUB_WORKSPACE/dex/idric/build/exec/idric-dex" "$RUNNER_TEMP/dex-evidence"
      - name: Emit managed framework exports and the unchanged IB consumers
        shell: sh
        run: grease examples/autogenerated/managed-exports/verify.grease "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.tools/Idric" "$RUNNER_TEMP/dex-evidence/oracles/baksmali.jar" "$GITHUB_WORKSPACE/.tools/ib-search" "$GITHUB_WORKSPACE/.tools/ib-reader" "$RUNNER_TEMP/dex-evidence/managed-exports"
      - name: Execute checked core and framework calls and require mutant rejection on ART
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 29
          target: default
          arch: x86_64
          emulator-options: -no-window -no-audio -no-snapshot -no-boot-anim -memory 1024 -gpu swiftshader_indirect
          disable-animations: true
          script: |
            grease .tools/ai-ci/dex/observe-art.grease "$ANDROID_HOME/platform-tools/adb" emulator-5554 "$RUNNER_TEMP/dex-evidence/sources/calls.dex" "$RUNNER_TEMP/dex-evidence/runner.dex" "$RUNNER_TEMP/dex-evidence/mutant.dex" "$RUNNER_TEMP/dex-evidence/art"
            grease dex/idric/observe-argv-art.grease "$ANDROID_HOME/platform-tools/adb" emulator-5554 "$GITHUB_WORKSPACE/dex/idric/build/argv-boundary.dex" "$RUNNER_TEMP/dex-evidence/argv-runner.dex" "$GITHUB_WORKSPACE/dex/idric/build/argv-wrong.dex" "$RUNNER_TEMP/dex-evidence/argv-art"
            grease dex/idric/observe-runtime-args.grease "$ANDROID_HOME/platform-tools/adb" emulator-5554 "$GITHUB_WORKSPACE/dex/idric/build/runtime-arguments.dex" "$RUNNER_TEMP/dex-evidence/runtime-arg-runner.dex" "$GITHUB_WORKSPACE/dex/idric/build/runtime-arguments-wrong.dex" "$RUNNER_TEMP/dex-evidence/runtime-art"
            grease examples/autogenerated/icu-runtime/observe-arguments.grease "$ANDROID_HOME/platform-tools/adb" emulator-5554 "$RUNNER_TEMP/dex-evidence/checked-arguments" "$RUNNER_TEMP/dex-evidence/checked-arguments-art"
            grease examples/autogenerated/managed-exports/observe-art.grease "$GITHUB_WORKSPACE" "$RUNNER_TEMP/dex-evidence/managed-exports" "$RUNNER_TEMP/dex-evidence/oracles/smali.jar" "$ANDROID_HOME/platform-tools/adb" emulator-5554 "$RUNNER_TEMP/dex-evidence/managed-exports-art"
            grease examples/autogenerated/pure-text-export/verify-art.grease "$ANDROID_HOME/platform-tools/adb" emulator-5554 "$RUNNER_TEMP/dex-evidence/pure-text"
      - name: Compile unchanged checked ICU and build its maintained JNI transport
        shell: sh
        run: grease examples/autogenerated/icu-runtime/prepare-icu.grease "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.tools/Idric" "$GITHUB_WORKSPACE/.tools/icu" "$GITHUB_WORKSPACE/.tools/Idric-Net" "$GITHUB_WORKSPACE/.tools/openssl" "$ANDROID_HOME" "${{ steps.ick.outputs.compiler }}" "$GITHUB_WORKSPACE/.tools/icu-observer" "$RUNNER_TEMP/dex-evidence/oracles/baksmali.jar" "$RUNNER_TEMP/dex-evidence/icu"
      - name: Execute unchanged checked ICU and its native transport on ART
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 29
          target: default
          arch: x86_64
          emulator-options: -no-window -no-audio -no-snapshot -no-boot-anim -memory 1024 -gpu swiftshader_indirect
          disable-animations: true
          script: |
            grease examples/autogenerated/icu-runtime/observe-icu.grease "$ANDROID_HOME/platform-tools/adb" emulator-5554 "$RUNNER_TEMP/dex-evidence/icu" "$RUNNER_TEMP/dex-evidence/icu-art"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: canonical-dex-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/dex-evidence
