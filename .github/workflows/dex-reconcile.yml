name: Canonical checked DEX and JNI
on:
  pull_request:
    paths: ['dex/idric/**', 'examples/autogenerated/**', '.github/workflows/dex-reconcile.yml']
  push:
    branches: [main]
    paths: ['dex/idric/**', 'examples/autogenerated/**', '.github/workflows/dex-reconcile.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  checked-dex:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ASAN_OPTIONS: detect_leaks=0
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/Idric
          ref: 740bbf2b1d9e811fd00c719c3473eede17ceea3b
          path: .tools/Idric
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/ai-ci
          ref: aa49ac75a6db8c8043b382932d39ac3e5bd2b0db
          path: .tools/ai-ci
          persist-credentials: false
      - name: Qualify pinned ICK for host native bootstrap stages
        id: ick
        uses: isomorphisms/ai-ci/ick-host@32cb45b3a3a257aeb07881c75f3b846495cfb2c9
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/ib
          ref: 8b6a1694ffb168f5e206262eeee89830d0733194
          path: .tools/ib-material
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/catfood
          ref: 609a9628d5a52860f956bf62e0914a0cd03292ae
          path: .tools/catfood
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: dilapidated-shed/grease
          ref: f19c94c6df18cddbdc1e81463e5bd689533e3c13
          path: .tools/runtime/grease
          submodules: true
          persist-credentials: false
      - name: Build pinned Grease through its existing Cat Food bootstrap
        shell: sh
        env:
          CATFOOD_ROOT: ${{ github.workspace }}/.tools/runtime
          CATFOOD_JOBS: '2'
        run: |
          sh .tools/catfood/build-tools.sh
          printf '%s\n' "$CATFOOD_ROOT/.build/grease/bin" >> "$GITHUB_PATH"
      # Same source/runtime key and stage path as the pinned ick-host action.
      # Save after qualification even if a later application test fails.
      - name: Recover the qualified compiler cache identity
        id: qualified_ick_cache
        shell: sh
        run: grease dex/idric/qualified-compiler-cache.grease "$RUNNER_TEMP/ick-host-build/host-runtime-key-input.tsv" "$GITHUB_OUTPUT"
      - name: Preserve the already qualified native compiler for retries
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/ick-host-stage
          key: ick-host-v1-${{ runner.os }}-${{ runner.arch }}-fbe86e23d55cfec2000c08e61deea2a407fd7175-${{ steps.qualified_ick_cache.outputs.runtime_key }}
      - name: Restore only the exact pinned frontend bootstrap
        id: frontend_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          key: idric-740bbf2b1d9e811fd00c719c3473eede17ceea3b-ick-32cb45b3a3a257aeb07881c75f3b846495cfb2c9-ubuntu24-x86_64-v1
          path: |
            .tools/Idric/_/.tools
            .tools/Idric/_/bootstrap-build
            .tools/Idric/_/build
      - name: Build pinned checked frontend with explicit host C compiler
        if: steps.frontend_cache.outputs.cache-hit != 'true'
        shell: sh
        env:
          CC: ${{ steps.ick.outputs.compiler }} -fno-link-libatomic
        run: .tools/Idric/edric bootstrap
      - name: Retain the exact frontend before consumer package installation
        if: steps.frontend_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          key: ${{ steps.frontend_cache.outputs.cache-primary-key }}
          path: |
            .tools/Idric/_/.tools
            .tools/Idric/_/bootstrap-build
            .tools/Idric/_/build
      - name: Install the pinned Android parser and NDK
        shell: sh
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0" "ndk;27.2.12479018"'
      - name: Provision ripgrep required by the pinned source and metadata tests
        shell: sh
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ripgrep
          fi
          command -v rg
          rg --version | head -n 1
      - name: Build canonical package and run host/source regressions serially
        shell: sh
        run: grease dex/idric/prepare-reconcile.grease "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.tools/Idric" "$ANDROID_HOME" "$RUNNER_TEMP/dex-evidence"
      - name: Reconcile Material construction and lifecycle source without changing IB
        shell: sh
        run: grease examples/autogenerated/framework-construction/verify.grease "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.tools/Idric" "$GITHUB_WORKSPACE/dex/idric/build/exec/idric-dex" "$GITHUB_WORKSPACE/dex/idric/build/ttc" "$GITHUB_WORKSPACE/.tools/ib-material" "$RUNNER_TEMP/dex-evidence/oracles/baksmali.jar" "$RUNNER_TEMP/dex-evidence/construction"
      - name: Compile independent observer and deliberately wrong checked helper
        shell: sh
        env:
          IDRIS2_PREFIX: ${{ github.workspace }}/.tools/Idric/_/bootstrap-build
          IDRIS2_PACKAGE_PATH: ${{ github.workspace }}/.tools/Idric/_/bootstrap-build/idris2-0.8.0
          IDRIS2_PATH: ${{ github.workspace }}/dex/idric/build/ttc
        run: grease dex/idric/prepare-art.grease "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.tools/ai-ci" "$GITHUB_WORKSPACE/dex/idric/build/exec/idric-dex" "$RUNNER_TEMP/dex-evidence"
      # ICU/OpenSSL transport remains qualified by its separate integration PR.
      # Runtime argument fixtures below have no ICU dependency.
      - name: Prepare emulator KVM access
        shell: sh
        run: grease -c 'sudo chmod 666 /dev/kvm'
      - name: Execute actual checked calls and require mutant rejection on ART
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 29
          target: default
          arch: x86_64
          emulator-options: -no-window -no-audio -no-snapshot -no-boot-anim -memory 1024 -gpu swiftshader_indirect
          disable-animations: true
          script: |
            grease .tools/ai-ci/dex/observe-art.grease "$ANDROID_HOME/platform-tools/adb" emulator-5554 "$RUNNER_TEMP/dex-evidence/sources/calls.dex" "$RUNNER_TEMP/dex-evidence/runner.dex" "$RUNNER_TEMP/dex-evidence/mutant.dex" "$RUNNER_TEMP/dex-evidence/art"
            grease dex/idric/observe-argv-art.grease "$ANDROID_HOME/platform-tools/adb" emulator-5554 "$GITHUB_WORKSPACE/dex/idric/build/argv-boundary.dex" "$RUNNER_TEMP/dex-evidence/argv-runner.dex" "$GITHUB_WORKSPACE/dex/idric/build/argv-wrong.dex" "$RUNNER_TEMP/dex-evidence/argv-art"
            grease dex/idric/observe-runtime-args.grease "$ANDROID_HOME/platform-tools/adb" emulator-5554 "$GITHUB_WORKSPACE/dex/idric/build/runtime-arguments.dex" "$RUNNER_TEMP/dex-evidence/runtime-arg-runner.dex" "$GITHUB_WORKSPACE/dex/idric/build/runtime-arguments-wrong.dex" "$RUNNER_TEMP/dex-evidence/runtime-art"
            grease examples/autogenerated/icu-runtime/observe-arguments.grease "$ANDROID_HOME/platform-tools/adb" emulator-5554 "$RUNNER_TEMP/dex-evidence/checked-arguments" "$RUNNER_TEMP/dex-evidence/checked-arguments-art"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: canonical-dex-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/dex-evidence
