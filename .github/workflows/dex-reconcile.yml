name: Canonical checked DEX and JNI
on:
  pull_request:
    paths: ['dex/idric/**', 'examples/autogenerated/**', '.github/workflows/dex-reconcile.yml']
  push:
    branches: [main]
    paths: ['dex/idric/**', 'examples/autogenerated/**', '.github/workflows/dex-reconcile.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  checked-dex:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ASAN_OPTIONS: detect_leaks=0
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/Idric
          ref: 740bbf2b1d9e811fd00c719c3473eede17ceea3b
          path: .tools/Idric
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/ai-ci
          ref: aa49ac75a6db8c8043b382932d39ac3e5bd2b0db
          path: .tools/ai-ci
          persist-credentials: false
      - name: Qualify pinned ICK for host native bootstrap stages
        id: ick
        uses: isomorphisms/ai-ci/ick-host@32cb45b3a3a257aeb07881c75f3b846495cfb2c9
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/ib
          ref: 8b6a1694ffb168f5e206262eeee89830d0733194
          path: .tools/ib-material
          persist-credentials: false
      # Minimal fixed host provisioning before the compiled Grease is available.
      - name: Provision immutable compiled Grease and its original launcher
        shell: sh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/grease/bin"
          gh api repos/dilapidated-shed/grease/actions/artifacts/12192502970/zip > "$RUNNER_TEMP/grease.zip"
          unzip -p "$RUNNER_TEMP/grease.zip" _bin/cxx-asan/ysh > "$RUNNER_TEMP/grease/bin/ysh"
          curl -fL https://github.com/dilapidated-shed/grease/releases/download/tablet-aarch64-9b3dc8904891/grease-aarch64-termux.tar.gz -o "$RUNNER_TEMP/launcher.tar.gz"
          printf '%s  %s\n' 3ddb962ef313e528e525fa03518f494577e921c2201ecb49f7a11f2fbf4e82b2 "$RUNNER_TEMP/launcher.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/launcher.tar.gz" -C "$RUNNER_TEMP/grease" ./bin/grease
          printf '%s  %s\n' 7e31cd05b7a9d8fb2a4a9e003a7f3fcb0159138506d17f0fb28da8cbe22aa85c "$RUNNER_TEMP/grease/bin/ysh" | sha256sum -c -
          chmod 755 "$RUNNER_TEMP/grease/bin/ysh"
          printf '%s\n' "$RUNNER_TEMP/grease/bin" >> "$GITHUB_PATH"
      - name: Build pinned checked frontend with explicit host C compiler
        shell: sh
        env:
          CC: ${{ steps.ick.outputs.compiler }} -fno-link-libatomic
        run: .tools/Idric/edric bootstrap
      - name: Require the declared independent Android parser
        shell: sh
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0"'
      - name: Build canonical package and run host/source regressions serially
        shell: sh
        run: grease dex/idric/prepare-reconcile.grease "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.tools/Idric" "$ANDROID_HOME" "$RUNNER_TEMP/dex-evidence"
      - name: Reconcile Material construction and lifecycle source without changing IB
        shell: sh
        run: grease examples/autogenerated/framework-construction/verify.grease "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.tools/Idric" "$GITHUB_WORKSPACE/dex/idric/build/exec/idric-dex" "$GITHUB_WORKSPACE/dex/idric/build/ttc" "$GITHUB_WORKSPACE/.tools/ib-material" "$RUNNER_TEMP/dex-evidence/oracles/baksmali.jar" "$RUNNER_TEMP/dex-evidence/construction"
      - name: Compile independent observer and deliberately wrong checked helper
        shell: sh
        env:
          IDRIS2_PREFIX: ${{ github.workspace }}/.tools/Idric/_/bootstrap-build
          IDRIS2_PACKAGE_PATH: ${{ github.workspace }}/.tools/Idric/_/bootstrap-build/idris2-0.8.0
          IDRIS2_PATH: ${{ github.workspace }}/dex/idric/build/ttc
        run: grease dex/idric/prepare-art.grease "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.tools/ai-ci" "$GITHUB_WORKSPACE/dex/idric/build/exec/idric-dex" "$RUNNER_TEMP/dex-evidence"
      - name: Execute actual checked calls and require mutant rejection on ART
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 29
          target: default
          arch: x86_64
          emulator-options: -no-window -no-audio -no-snapshot -no-boot-anim -memory 1024 -gpu swiftshader_indirect
          disable-animations: true
          script: |
            grease .tools/ai-ci/dex/observe-art.grease "$ANDROID_HOME/platform-tools/adb" emulator-5554 "$RUNNER_TEMP/dex-evidence/sources/calls.dex" "$RUNNER_TEMP/dex-evidence/runner.dex" "$RUNNER_TEMP/dex-evidence/mutant.dex" "$RUNNER_TEMP/dex-evidence/art"
            grease dex/idric/observe-argv-art.grease "$ANDROID_HOME/platform-tools/adb" emulator-5554 "$GITHUB_WORKSPACE/dex/idric/build/argv-boundary.dex" "$RUNNER_TEMP/dex-evidence/argv-runner.dex" "$GITHUB_WORKSPACE/dex/idric/build/argv-wrong.dex" "$RUNNER_TEMP/dex-evidence/argv-art"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: canonical-dex-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/dex-evidence
