name: Idriç DEX foreign lowering

on:
  push:
    branches:
      - binder/idric-shizuku-source-lower
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: idric-dex-foreign-lower-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  foreign-lowering:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Android-NDK branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Checkout current Idriç compiler
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: isomorphisms/Idric
          ref: Idriç
          path: dex/idric/Idric

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl python3 util-linux default-jre-headless

      - name: Bootstrap exact Idriç checkout
        working-directory: dex/idric/Idric
        run: |
          ./edric all
          test -x build/exec/idris2
          build/exec/idris2 --version

      - name: Typecheck foreign-aware DEX backend
        working-directory: dex/idric
        run: |
          IDRIC="$PWD/Idric/build/exec/idris2"
          make check IDRIC="$IDRIC" IDRIC_REPO="$PWD/Idric"

      - name: Check foreign convention contract
        working-directory: dex/idric
        run: |
          IDRIC="$PWD/Idric/build/exec/idris2"
          make dex-foreign-spec-test IDRIC="$IDRIC" IDRIC_REPO="$PWD/Idric"

      - name: Compile and parse checked-source foreign DEX
        working-directory: dex/idric
        run: |
          IDRIC="$PWD/Idric/build/exec/idris2"
          make dex-foreign-validation IDRIC="$IDRIC" IDRIC_REPO="$PWD/Idric"

      - name: Retain checked-source foreign evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: idric-dex-foreign-${{ github.sha }}
          path: |
            dex/idric/build/exec/foreign.checked.anf
            dex/idric/build/exec/foreign.dex.plan
            dex/idric/build/exec/foreign.smali
            dex/idric/build/exec/foreign.dex
            dex/idric/build/exec/baksmali-foreign/
          if-no-files-found: warn
          retention-days: 14
