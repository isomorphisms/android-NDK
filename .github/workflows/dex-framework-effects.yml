name: Checked DEX framework effects

on:
  pull_request:
    paths:
      - 'dex/idric/**'
      - 'quick-settings/**'
      - 'examples/autogenerated/quick-settings-*/**'
      - 'examples/autogenerated/dex-invoke-range/**'
      - 'examples/autogenerated/dex-constant-tags/**'
      - 'examples/autogenerated/interface-callback/**'
      - 'examples/autogenerated/framework-construction/**'
      - 'examples/autogenerated/native-view-callback/**'
      - 'apk/**'
      - '.github/workflows/dex-framework-effects.yml'
  push:
    branches: [main]
    paths:
      - 'dex/idric/**'
      - 'quick-settings/**'
      - 'examples/autogenerated/quick-settings-*/**'
      - 'examples/autogenerated/dex-invoke-range/**'
      - 'examples/autogenerated/dex-constant-tags/**'
      - 'examples/autogenerated/interface-callback/**'
      - 'examples/autogenerated/framework-construction/**'
      - 'examples/autogenerated/native-view-callback/**'
      - 'apk/**'
      - '.github/workflows/dex-framework-effects.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dex-effects-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checked-effects:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      CATFOOD_ROOT: ${{ github.workspace }}/.tools/runtime
      CATFOOD_JOBS: '2'
      JOBS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: isomorphisms/Idric
          ref: ff4d852862a3942592f8ade9afde8d409d9803be
          path: .tools/Idric
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: isomorphisms/ib
          ref: 446a183e245632608bf2868d4a34eb2f5225bd67
          path: .tools/ib
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: isomorphisms/ib
          ref: 9027d5ea0ce8718b0337b4cd3d16c0549dc2b2ed
          path: .tools/ib-reader
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: isomorphisms/ib
          ref: e53df40034f7e0413f07b5f34b0510f17ae52fd2
          path: .tools/ib-screen
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: isomorphisms/catfood
          ref: 609a9628d5a52860f956bf62e0914a0cd03292ae
          path: .tools/catfood
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: dilapidated-shed/grease
          ref: f19c94c6df18cddbdc1e81463e5bd689533e3c13
          path: .tools/runtime/grease
          submodules: true
          persist-credentials: false
      # Fixed existing bootstrap interface. Maintained compiler/verification
      # below follows the current Idric -> checked DEX path, not Java source.
      - name: Refresh host package index
        shell: sh
        run: sudo apt-get update
      - name: Install host prerequisites
        shell: sh
        run: sudo apt-get install -y build-essential curl xz-utils libreadline-dev libffi-dev libgmp-dev zlib1g-dev default-jre-headless ripgrep
      - name: Build pinned Grease runtime through Cat Food
        shell: sh
        run: sh .tools/catfood/build-tools.sh
      - name: Restore pinned Idriç compiler and API
        id: idric-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            .tools/Idric/_/.tools
            .tools/Idric/_/build
            .tools/Idric/_/bootstrap-build
            .tools/Idric/_/libs/*/build
            .tools/Idric/_/src/IdrisPaths.idr
          key: idric-bootstrap-api-v1-ubuntu-24.04-${{ runner.arch }}-ff4d852862a3942592f8ade9afde8d409d9803be
      - name: Build pinned Idriç host compiler
        if: steps.idric-cache.outputs.cache-hit != 'true'
        shell: sh
        run: sh .tools/Idric/edric all
      - name: Install the pinned compiler API into its bootstrap prefix
        if: steps.idric-cache.outputs.cache-hit != 'true'
        shell: sh
        run: env IDRIS2_PREFIX="$GITHUB_WORKSPACE/.tools/Idric/_/bootstrap-build" CHEZ="$GITHUB_WORKSPACE/.tools/Idric/_/.tools/bin/scheme" "$GITHUB_WORKSPACE/.tools/Idric/_/build/exec/idris2" --install "$GITHUB_WORKSPACE/.tools/Idric/_/idris2api.ipkg"
      - name: Require installed API before caching
        if: steps.idric-cache.outputs.cache-hit != 'true'
        shell: sh
        run: .tools/runtime/.build/grease/bin/grease -c 'test -s .tools/Idric/_/bootstrap-build/idris2-0.8.0/idris2-0.8.0/idris2.ipkg'
      - name: Save pinned Idriç compiler and API
        if: steps.idric-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            .tools/Idric/_/.tools
            .tools/Idric/_/build
            .tools/Idric/_/bootstrap-build
            .tools/Idric/_/libs/*/build
            .tools/Idric/_/src/IdrisPaths.idr
          key: idric-bootstrap-api-v1-ubuntu-24.04-${{ runner.arch }}-ff4d852862a3942592f8ade9afde8d409d9803be
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: 'build-tools;35.0.0 platforms;android-34'
      - name: Compile and independently parse fresh DEX candidates
        shell: sh
        run: .tools/runtime/.build/grease/bin/grease dex/idric/verify-effects.grease "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.tools/Idric" "$GITHUB_WORKSPACE/.tools/Idric/_/.tools/bin/scheme" "$ANDROID_HOME/build-tools/35.0.0/dexdump" "$RUNNER_TEMP/dex-effects-evidence"
      - name: Compile checked unpack and unchanged IB source with semantic and refusal controls
        shell: sh
        run: .tools/runtime/.build/grease/bin/grease dex/idric/verify-unpack.grease "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.tools/Idric" "$RUNNER_TEMP/dex-effects-evidence" "$ANDROID_HOME/build-tools/35.0.0/dexdump" "$GITHUB_WORKSPACE/.tools/ib" "$RUNNER_TEMP/dex-unpack-evidence" "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Prepare external oracle and ephemeral KVM access
        shell: sh
        run: .tools/runtime/.build/grease/bin/grease dex/idric/prepare-effects-ci.grease "$GITHUB_WORKSPACE" "$RUNNER_TEMP/dex-effects-oracles"
      - name: Compile checked interface callbacks and refusal controls
        shell: sh
        run: .tools/runtime/.build/grease/bin/grease dex/idric/verify-callback.grease "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.tools/Idric" "$RUNNER_TEMP/dex-effects-evidence" "$ANDROID_HOME/build-tools/35.0.0/dexdump" "$RUNNER_TEMP/dex-callback-evidence" "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Compare final plans and smali with independently decoded candidate bytes
        shell: sh
        run: .tools/runtime/.build/grease/bin/grease dex/idric/verify-layout.grease "$GITHUB_WORKSPACE" "$RUNNER_TEMP/dex-effects-evidence" "$RUNNER_TEMP/dex-effects-oracles/smali-3.0.10.jar" "$ANDROID_HOME/build-tools/35.0.0/dexdump"
      - name: Qualify checked constructors and Activity lifecycle without application bytecode substitutes
        shell: sh
        run: .tools/runtime/.build/grease/bin/grease examples/autogenerated/framework-construction/verify.grease "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.tools/Idric" "$RUNNER_TEMP/dex-effects-evidence/backend/exec/idric-dex" "$RUNNER_TEMP/dex-effects-evidence/backend/ttc" "$GITHUB_WORKSPACE/.tools/ib-reader" "$RUNNER_TEMP/dex-effects-oracles/baksmali-3.0.10.jar" "$RUNNER_TEMP/dex-construction-evidence"
      - name: Build pinned IB native reader and package refusal controls
        shell: sh
        run: .tools/runtime/.build/grease/bin/grease examples/autogenerated/framework-construction/build-ib-screen.grease "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.tools/Idric" "$RUNNER_TEMP/dex-effects-evidence" "$GITHUB_WORKSPACE/.tools/ib-screen" "$ANDROID_HOME" "$RUNNER_TEMP/dex-effects-oracles" "$RUNNER_TEMP/ib-screen-evidence"
      - name: Compile and independently decode the actual NativeActivity callback fixture
        shell: sh
        run: .tools/runtime/.build/grease/bin/grease examples/autogenerated/native-view-callback/verify.grease "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.tools/Idric" "$RUNNER_TEMP/dex-effects-evidence/backend/ttc" "$ANDROID_HOME/build-tools/35.0.0/dexdump" "$RUNNER_TEMP/dex-effects-oracles/baksmali-3.0.10.jar" "$RUNNER_TEMP/native-callback-evidence"
      - name: Retain exact callback bytes for dependent packaging qualification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-callback-input-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/native-callback-evidence/classes.dex
            ${{ runner.temp }}/native-callback-evidence/baksmali.jar
            ${{ runner.temp }}/native-callback-evidence/*revision.txt
            ${{ runner.temp }}/native-callback-evidence/result.txt
          if-no-files-found: error
      - name: Run existing candidates, unpack and unchanged IB diagnostics on Android 14 ART
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          emulator-port: 5554
          emulator-boot-timeout: 300
          disable-animations: true
          script: |
            .tools/runtime/.build/grease/bin/grease dex/idric/verify-effects-art.grease "$GITHUB_WORKSPACE" "$RUNNER_TEMP/dex-effects-evidence" "$RUNNER_TEMP/dex-effects-oracles/smali-3.0.10.jar" "$ANDROID_HOME/platform-tools/adb"
            .tools/runtime/.build/grease/bin/grease dex/idric/verify-unpack-art.grease "$GITHUB_WORKSPACE" "$RUNNER_TEMP/dex-unpack-evidence" "$RUNNER_TEMP/dex-effects-oracles/smali-3.0.10.jar" "$ANDROID_HOME/platform-tools/adb"
            .tools/runtime/.build/grease/bin/grease dex/idric/verify-callback-art.grease "$GITHUB_WORKSPACE" "$RUNNER_TEMP/dex-callback-evidence" "$RUNNER_TEMP/dex-effects-oracles/smali-3.0.10.jar" "$ANDROID_HOME/platform-tools/adb"
            .tools/runtime/.build/grease/bin/grease examples/autogenerated/framework-construction/verify-instrumentation.grease "$GITHUB_WORKSPACE" "$RUNNER_TEMP/dex-construction-evidence" "$RUNNER_TEMP/dex-effects-oracles/smali-3.0.10.jar" "$ANDROID_HOME" "$RUNNER_TEMP/ib-screen-evidence/public-test-keystore" "$ANDROID_HOME/platform-tools/adb"
            .tools/runtime/.build/grease/bin/grease .tools/ib-screen/examples/autogenerated/material-reader-screen/verify-screen.grease "$ANDROID_HOME" "$RUNNER_TEMP/ib-screen-evidence/build/package/ib-material-reader.apk" "$ANDROID_HOME/platform-tools/adb" "$RUNNER_TEMP/ib-screen-evidence/screen"
            .tools/runtime/.build/grease/bin/grease examples/autogenerated/framework-construction/verify-source-handoff.grease "$ANDROID_HOME/platform-tools/adb" "$RUNNER_TEMP/ib-screen-evidence/screen" "$RUNNER_TEMP/ib-screen-evidence/source-handoff"
      - name: Require actual IB target success independently of standalone unpack
        shell: sh
        run: .tools/runtime/.build/grease/bin/grease dex/idric/require-unpack-acceptance.grease "$RUNNER_TEMP/dex-unpack-evidence"
      - name: Retain source, DEX and scoped ART evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dex-framework-effects-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/dex-effects-evidence/*.txt
            ${{ runner.temp }}/dex-effects-evidence/*.anf
            ${{ runner.temp }}/dex-effects-evidence/*.plan
            ${{ runner.temp }}/dex-effects-evidence/*.smali
            ${{ runner.temp }}/dex-effects-evidence/*.dex
            ${{ runner.temp }}/dex-effects-evidence/art/
            ${{ runner.temp }}/dex-effects-evidence/layout-consistency/
            ${{ runner.temp }}/dex-unpack-evidence/
            ${{ runner.temp }}/dex-callback-evidence/
            ${{ runner.temp }}/dex-construction-evidence/
            ${{ runner.temp }}/ib-screen-evidence/
            ${{ runner.temp }}/native-callback-evidence/
          if-no-files-found: warn

  native-callback-package:
    needs: checked-effects
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphismes/wegert
          ref: dfa3751f0282cdf6a2083c97063b0e8e996d0d92
          path: signing/wegert
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: native-callback-input-${{ github.event.pull_request.head.sha || github.sha }}
          path: callback-input
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: isomorphisms/catfood
          ref: 609a9628d5a52860f956bf62e0914a0cd03292ae
          path: .packaging-tools/catfood
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: dilapidated-shed/grease
          ref: f19c94c6df18cddbdc1e81463e5bd689533e3c13
          path: .packaging-tools/runtime/grease
          submodules: true
          persist-credentials: false
      - name: Build the pinned Grease runtime through Cat Food
        env:
          CATFOOD_ROOT: ${{ github.workspace }}/.packaging-tools/runtime
          CATFOOD_JOBS: '2'
        run: sh .packaging-tools/catfood/build-tools.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: ''
      - name: Install Android packaging dependencies
        run: sdkmanager "platforms;android-34" "build-tools;36.0.0" "ndk;29.0.14206865"
      - name: Qualify reproducible declared DEX packaging and hostile controls
        env:
          ANDROID_TEST_KEYSTORE: ${{ github.workspace }}/signing/wegert/_/build/app/wegert-debug.keystore
          ANDROID_NDK_VERSION: 29.0.14206865
          ANDROID_GREASE: ${{ github.workspace }}/.packaging-tools/runtime/.build/grease/bin/grease
          ANDROID_TEST_DEX_FILE: ${{ github.workspace }}/callback-input/classes.dex
          ANDROID_BAKSMALI_JAR: ${{ github.workspace }}/callback-input/baksmali.jar
        run: bash apk/tests/run-packager.sh
