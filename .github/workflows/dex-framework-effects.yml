name: Checked DEX framework effects

on:
  pull_request:
    paths:
      - 'dex/idric/**'
      - 'quick-settings/**'
      - 'examples/autogenerated/quick-settings-*/**'
      - 'examples/autogenerated/dex-invoke-range/**'
      - '.github/workflows/dex-framework-effects.yml'
  push:
    branches: [main]
    paths:
      - 'dex/idric/**'
      - 'quick-settings/**'
      - 'examples/autogenerated/quick-settings-*/**'
      - 'examples/autogenerated/dex-invoke-range/**'
      - '.github/workflows/dex-framework-effects.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dex-effects-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checked-effects:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      CATFOOD_ROOT: ${{ github.workspace }}/.tools/runtime
      CATFOOD_JOBS: '2'
      JOBS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: isomorphisms/Idric
          ref: ff4d852862a3942592f8ade9afde8d409d9803be
          path: .tools/Idric
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: isomorphisms/catfood
          ref: 609a9628d5a52860f956bf62e0914a0cd03292ae
          path: .tools/catfood
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: dilapidated-shed/grease
          ref: f19c94c6df18cddbdc1e81463e5bd689533e3c13
          path: .tools/runtime/grease
          submodules: true
          persist-credentials: false
      # Fixed bootstrap interface: run the existing recipes. New orchestration
      # below is Grease source executed by the actual pinned Grease runtime.
      - name: Refresh host package index
        shell: sh
        run: sudo apt-get update
      - name: Install host prerequisites
        shell: sh
        run: sudo apt-get install -y build-essential curl xz-utils libreadline-dev libffi-dev libgmp-dev zlib1g-dev default-jre-headless ripgrep
      - name: Build pinned Grease runtime through Cat Food
        shell: sh
        run: sh .tools/catfood/build-tools.sh
      - name: Restore pinned Idriç compiler and API
        id: idric-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            .tools/Idric/_/.tools
            .tools/Idric/_/build
            .tools/Idric/_/bootstrap-build
            .tools/Idric/_/libs/*/build
            .tools/Idric/_/src/IdrisPaths.idr
          key: idric-bootstrap-api-v1-ubuntu-24.04-${{ runner.arch }}-ff4d852862a3942592f8ade9afde8d409d9803be
      - name: Build pinned Idriç host compiler
        if: steps.idric-cache.outputs.cache-hit != 'true'
        shell: sh
        run: sh .tools/Idric/edric all
      - name: Install the pinned compiler API into its bootstrap prefix
        if: steps.idric-cache.outputs.cache-hit != 'true'
        shell: sh
        run: env IDRIS2_PREFIX="$GITHUB_WORKSPACE/.tools/Idric/_/bootstrap-build" CHEZ="$GITHUB_WORKSPACE/.tools/Idric/_/.tools/bin/scheme" "$GITHUB_WORKSPACE/.tools/Idric/_/build/exec/idris2" --install "$GITHUB_WORKSPACE/.tools/Idric/_/idris2api.ipkg"
      - name: Require installed API before caching
        if: steps.idric-cache.outputs.cache-hit != 'true'
        shell: sh
        run: .tools/runtime/.build/grease/bin/grease -c 'test -s "$GITHUB_WORKSPACE/.tools/Idric/_/bootstrap-build/idris2-0.8.0/idris2-0.8.0/idris2.ipkg"'
      - name: Save pinned Idriç compiler and API
        if: steps.idric-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            .tools/Idric/_/.tools
            .tools/Idric/_/build
            .tools/Idric/_/bootstrap-build
            .tools/Idric/_/libs/*/build
            .tools/Idric/_/src/IdrisPaths.idr
          key: idric-bootstrap-api-v1-ubuntu-24.04-${{ runner.arch }}-ff4d852862a3942592f8ade9afde8d409d9803be
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: 'build-tools;35.0.0'
      - name: Compile and independently parse fresh DEX candidates
        shell: sh
        run: .tools/runtime/.build/grease/bin/grease dex/idric/verify-effects.grease "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.tools/Idric" "$GITHUB_WORKSPACE/.tools/Idric/_/.tools/bin/scheme" "$ANDROID_HOME/build-tools/35.0.0/dexdump" "$RUNNER_TEMP/dex-effects-evidence"
      - name: Prepare external oracle and ephemeral KVM access
        shell: sh
        run: .tools/runtime/.build/grease/bin/grease dex/idric/prepare-effects-ci.grease "$GITHUB_WORKSPACE" "$RUNNER_TEMP/dex-effects-oracles"
      - name: Run purpose-neutral candidates on Android 14 ART
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          emulator-port: 5554
          emulator-boot-timeout: 300
          disable-animations: true
          script: .tools/runtime/.build/grease/bin/grease dex/idric/verify-effects-art.grease "$GITHUB_WORKSPACE" "$RUNNER_TEMP/dex-effects-evidence" "$RUNNER_TEMP/dex-effects-oracles/smali-3.0.10.jar" "$ANDROID_HOME/platform-tools/adb"
      - name: Retain source, DEX and scoped ART evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dex-framework-effects-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/dex-effects-evidence/*.txt
            ${{ runner.temp }}/dex-effects-evidence/*.anf
            ${{ runner.temp }}/dex-effects-evidence/*.plan
            ${{ runner.temp }}/dex-effects-evidence/*.smali
            ${{ runner.temp }}/dex-effects-evidence/*.dex
            ${{ runner.temp }}/dex-effects-evidence/art/
          if-no-files-found: warn
