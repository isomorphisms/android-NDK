name: NativeActivity packager identity and resources

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphismes/wegert
          ref: dfa3751f0282cdf6a2083c97063b0e8e996d0d92
          path: signing/wegert
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: isomorphisms/catfood
          ref: 609a9628d5a52860f956bf62e0914a0cd03292ae
          path: .packaging-tools/catfood
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: dilapidated-shed/grease
          ref: f19c94c6df18cddbdc1e81463e5bd689533e3c13
          path: .packaging-tools/runtime/grease
          submodules: true
          persist-credentials: false
      - name: Build the pinned Grease runtime through Cat Food
        env:
          CATFOOD_ROOT: ${{ github.workspace }}/.packaging-tools/runtime
          CATFOOD_JOBS: '2'
        run: sh .packaging-tools/catfood/build-tools.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: ''
      - name: Install Android platform, NDK, packaging tools
        run: sdkmanager "platforms;android-34" "build-tools;36.0.0" "ndk;29.0.14206865"
      - name: Execute good and hostile APK fixtures
        env:
          ANDROID_TEST_KEYSTORE: ${{ github.workspace }}/signing/wegert/_/build/app/wegert-debug.keystore
          ANDROID_NDK_VERSION: 29.0.14206865
          ANDROID_GREASE: ${{ github.workspace }}/.packaging-tools/runtime/.build/grease/bin/grease
        run: bash apk/tests/run-packager.sh
