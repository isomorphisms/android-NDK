name: Checked DEX runtime repair

on:
  pull_request:
    paths:
      - 'dex/idric/**'
      - 'examples/autogenerated/runtime-*/**'
      - 'examples/autogenerated/jni-contracts/**'
      - 'examples/autogenerated/native-reference-fields/**'
      - 'examples/autogenerated/text-order/**'
      - 'examples/autogenerated/export-aliases/**'
      - '.github/workflows/dex-runtime-repair.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: dex-runtime-repair-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checked-runtime:
    name: Runtime repair ART API ${{ matrix.api }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 29
            target: default
          - api: 34
            target: google_apis
    env:
      ASAN_OPTIONS: detect_leaks=0
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/Idric
          ref: 740bbf2b1d9e811fd00c719c3473eede17ceea3b
          path: .tools/Idric
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/ai-ci
          ref: eee9433db43ed70e2eab654e05f7b862a5b5b979
          path: .tools/field-observer
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/ib
          ref: a7349efc8041b4c41ff158afca7f13079c8df1c2
          path: .tools/IB-consumer
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/ai-ci
          ref: 6ff5c5b8cb18cf3d05263e91dadd1c5d4022ad3d
          path: .tools/large-source-observer
          persist-credentials: false
      - name: Qualify pinned ICK for frontend native bootstrap
        id: ick
        uses: isomorphisms/ai-ci/ick-host@2383379394a7af5a8808abbe2d7b159a55328a83
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/catfood
          ref: 609a9628d5a52860f956bf62e0914a0cd03292ae
          path: .tools/catfood
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: dilapidated-shed/grease
          ref: f19c94c6df18cddbdc1e81463e5bd689533e3c13
          path: .tools/runtime/grease
          submodules: true
          persist-credentials: false
      # The former compiled artifact was deleted. Rebuild the same maintained
      # Grease source path used by framework effects, without an expiring asset.
      - name: Build pinned Grease through its existing Cat Food bootstrap
        shell: sh
        env:
          CATFOOD_ROOT: ${{ github.workspace }}/.tools/runtime
          CATFOOD_JOBS: '2'
          CC: ${{ steps.ick.outputs.compiler }} -fno-link-libatomic -std=gnu11
        run: |
          sh .tools/catfood/build-tools.sh
          printf '%s\n' "$CATFOOD_ROOT/.build/grease/bin" >> "$GITHUB_PATH"
      - name: Install declared host prerequisites
        shell: sh
        run: grease examples/autogenerated/runtime-acceptance/prepare-host.grease
      # Same source/runtime key and stage path as the pinned ick-host action.
      # Save after qualification even if a later application test fails.
      - name: Recover the qualified compiler cache identity
        id: qualified_ick_cache
        shell: sh
        run: grease dex/idric/qualified-compiler-cache.grease "$RUNNER_TEMP/ick-host-build/host-runtime-key-input.tsv" "$GITHUB_OUTPUT"
      - name: Preserve the already qualified native compiler for retries
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/ick-host-stage
          key: ick-host-v1-${{ runner.os }}-${{ runner.arch }}-fbe86e23d55cfec2000c08e61deea2a407fd7175-${{ steps.qualified_ick_cache.outputs.runtime_key }}
      - name: Restore exact pinned frontend bootstrap
        id: frontend_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          key: idric-740bbf2b1d9e811fd00c719c3473eede17ceea3b-ick-32cb45b3a3a257aeb07881c75f3b846495cfb2c9-ubuntu24-x86_64-v1
          path: |
            .tools/Idric/_/.tools
            .tools/Idric/_/bootstrap-build
            .tools/Idric/_/build
      - name: Build pinned frontend when not cached
        if: steps.frontend_cache.outputs.cache-hit != 'true'
        shell: sh
        env:
          CC: ${{ steps.ick.outputs.compiler }} -fno-link-libatomic
        run: .tools/Idric/edric bootstrap
      - name: Cache only the exact frontend bootstrap
        if: steps.frontend_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          key: ${{ steps.frontend_cache.outputs.cache-primary-key }}
          path: |
            .tools/Idric/_/.tools
            .tools/Idric/_/bootstrap-build
            .tools/Idric/_/build
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: 'build-tools;35.0.0 ndk;27.2.12479018'
      - name: Compile checked runtime fixtures and independently decode candidates
        shell: sh
        run: grease examples/autogenerated/runtime-acceptance/build.grease "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.tools/Idric" "$RUNNER_TEMP/runtime-repair"
      - name: Qualify native reference declarations through the maintained writer
        shell: sh
        run: grease examples/autogenerated/native-reference-fields/verify.grease "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.tools/Idric" "$RUNNER_TEMP/runtime-repair/oracles/baksmali.jar" "$RUNNER_TEMP/runtime-repair/native-reference-fields"
      - name: Compile actual Text relations through each checked entry contract
        shell: sh
        run: grease examples/autogenerated/text-order/verify.grease "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.tools/Idric" "$RUNNER_TEMP/runtime-repair/oracles/baksmali.jar" "$RUNNER_TEMP/runtime-repair/text-order"
      - name: Compile checked IO and partial export aliases without changing their source semantics
        shell: sh
        run: grease examples/autogenerated/export-aliases/verify.grease "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.tools/Idric" "$RUNNER_TEMP/runtime-repair/oracles/baksmali.jar" "$RUNNER_TEMP/runtime-repair/export-aliases"
      - name: Parse maintained recursive-consumer coordinators
        shell: sh
        run: |
          grease -n examples/autogenerated/runtime-recursion/prepare.grease > "$RUNNER_TEMP/recursion-prepare.syntax.txt"
          grease -n examples/autogenerated/runtime-recursion/observe.grease > "$RUNNER_TEMP/recursion-observe.syntax.txt"
      - name: Compile real unchanged IB document consumer and recursive semantic controls
        shell: sh
        run: grease examples/autogenerated/runtime-recursion/prepare.grease "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.tools/IB-consumer" "$GITHUB_WORKSPACE/.tools/Idric" "$RUNNER_TEMP/runtime-repair/oracles/baksmali.jar" "$RUNNER_TEMP/runtime-repair/recursive-consumer"
      - name: Prepare emulator KVM access
        shell: sh
        run: grease -c 'sudo chmod 666 /dev/kvm'
      - name: Prepare checked JNI contracts with the qualified C driver
        shell: sh
        env:
          IDRIS2_PREFIX: ${{ github.workspace }}/.tools/Idric/_/bootstrap-build
          IDRIS2_PACKAGE_PATH: ${{ github.workspace }}/.tools/Idric/_/bootstrap-build/idris2-0.8.0
          IDRIS2_DATA: ${{ github.workspace }}/.tools/Idric/_/support
          IDRIS2_LIBS: ${{ github.workspace }}/.tools/Idric/_/support/c
          CHEZ: ${{ github.workspace }}/.tools/Idric/_/.tools/bin/scheme
        run: grease examples/autogenerated/runtime-acceptance/prepare-native.grease "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.tools/Idric" "$GITHUB_WORKSPACE/dex/idric/build/exec/idric-dex" "$RUNNER_TEMP/runtime-repair/oracles/baksmali.jar" "$RUNNER_TEMP/runtime-repair/oracles/smali.jar" "${{ steps.ick.outputs.compiler }}" "$ANDROID_HOME/ndk/27.2.12479018" "$RUNNER_TEMP/runtime-repair/native"
      - name: Execute checked candidates and reject changed-source mutant on ART
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        env:
          AICI_EXPECTED_ANDROID_API: ${{ matrix.api }}
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          disk-size: 2048M
          emulator-options: -no-window -no-audio -no-snapshot -no-boot-anim -memory 2048 -gpu swiftshader_indirect
          disable-animations: true
          script: |
            grease examples/autogenerated/runtime-acceptance/observe.grease "$ANDROID_HOME/platform-tools/adb" emulator-5554 "$RUNNER_TEMP/runtime-repair/candidates" "$RUNNER_TEMP/runtime-repair/art"
            grease examples/autogenerated/jni-contracts/observe.grease "$ANDROID_HOME/platform-tools/adb" emulator-5554 "$RUNNER_TEMP/runtime-repair/native" "$RUNNER_TEMP/runtime-repair/native-art"
            grease .tools/field-observer/ib-source/reader/observe-native-fields.grease "$GITHUB_WORKSPACE/.tools/field-observer" "$RUNNER_TEMP/runtime-repair/native-reference-fields" "$RUNNER_TEMP/runtime-repair/oracles/smali.jar" "$ANDROID_HOME/platform-tools/adb" emulator-5554 "$RUNNER_TEMP/runtime-repair/native-reference-fields-art"
            grease .tools/field-observer/ib-source/reader/observe-text-order.grease "$GITHUB_WORKSPACE/.tools/field-observer" "$RUNNER_TEMP/runtime-repair/text-order" "$RUNNER_TEMP/runtime-repair/oracles/smali.jar" "$ANDROID_HOME/platform-tools/adb" emulator-5554 "${{ matrix.api }}" "$RUNNER_TEMP/runtime-repair/text-order-art"
            grease .tools/field-observer/ib-source/reader/observe-export-aliases.grease "$GITHUB_WORKSPACE/.tools/field-observer" "$RUNNER_TEMP/runtime-repair/export-aliases" "$RUNNER_TEMP/runtime-repair/oracles/smali.jar" "$ANDROID_HOME/platform-tools/adb" emulator-5554 "${{ matrix.api }}" "$RUNNER_TEMP/runtime-repair/export-aliases-art"
            grease examples/autogenerated/runtime-recursion/observe.grease "$ANDROID_HOME/platform-tools/adb" emulator-5554 "$RUNNER_TEMP/runtime-repair/recursive-consumer" "$RUNNER_TEMP/runtime-repair/recursive-consumer-art"
            grease .tools/large-source-observer/ib-source/reader/observe-large-source.grease "$GITHUB_WORKSPACE/.tools/large-source-observer" "$RUNNER_TEMP/runtime-repair/recursive-consumer" "$RUNNER_TEMP/runtime-repair/oracles/smali.jar" "$ANDROID_HOME/platform-tools/adb" emulator-5554 "$RUNNER_TEMP/runtime-repair/IB-large-source-art"
      - name: Record exact-commit integration qualification
        shell: sh
        run: grease dex/idric/record-integration.grease "$GITHUB_WORKSPACE" "$RUNNER_TEMP/runtime-repair" runtime
      - name: Retain exact source, bytes, expectations and observed output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime-repair-api${{ matrix.api }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/runtime-repair
          if-no-files-found: warn
  recorded_backend_diagnosis:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: isomorphisms/android-NDK
          github-token: ${{ github.token }}
          run-id: 41305360245
          artifact-ids: '13082687993'
          merge-multiple: true
          path: ${{ runner.temp }}/recorded-backend-diagnosis
      - name: Read the exact failed checked compiler diagnostic
        shell: sh
        run: cat "$RUNNER_TEMP/recorded-backend-diagnosis/backend-build.txt"
