name: Checked DEX runtime repair

on:
  pull_request:
    paths:
      - 'dex/idric/**'
      - 'examples/autogenerated/runtime-*/**'
      - 'examples/autogenerated/jni-contracts/**'
      - '.github/workflows/dex-runtime-repair.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: dex-runtime-repair-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checked-runtime:
    name: Runtime repair ART API ${{ matrix.api }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 29
            target: default
          - api: 34
            target: google_apis
    env:
      ASAN_OPTIONS: detect_leaks=0
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/Idric
          ref: 740bbf2b1d9e811fd00c719c3473eede17ceea3b
          path: .tools/Idric
          persist-credentials: false
      - name: Qualify pinned ICK for frontend native bootstrap
        id: ick
        uses: isomorphisms/ai-ci/ick-host@32cb45b3a3a257aeb07881c75f3b846495cfb2c9
      # Same immutable runtime and fixed bootstrap interface as dex-reconcile.
      # Maintained candidate building and observation below are Grease-owned.
      - name: Provision existing pinned compiled Grease
        shell: sh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/grease/bin"
          gh api repos/dilapidated-shed/grease/actions/artifacts/12192502970/zip > "$RUNNER_TEMP/grease.zip"
          unzip -p "$RUNNER_TEMP/grease.zip" _bin/cxx-asan/ysh > "$RUNNER_TEMP/grease/bin/ysh"
          curl -fL https://github.com/dilapidated-shed/grease/releases/download/tablet-aarch64-9b3dc8904891/grease-aarch64-termux.tar.gz -o "$RUNNER_TEMP/launcher.tar.gz"
          printf '%s  %s\n' 3ddb962ef313e528e525fa03518f494577e921c2201ecb49f7a11f2fbf4e82b2 "$RUNNER_TEMP/launcher.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/launcher.tar.gz" -C "$RUNNER_TEMP/grease" ./bin/grease
          printf '%s  %s\n' 7e31cd05b7a9d8fb2a4a9e003a7f3fcb0159138506d17f0fb28da8cbe22aa85c "$RUNNER_TEMP/grease/bin/ysh" | sha256sum -c -
          chmod 755 "$RUNNER_TEMP/grease/bin/ysh"
          printf '%s\n' "$RUNNER_TEMP/grease/bin" >> "$GITHUB_PATH"
      - name: Install declared host prerequisites
        shell: sh
        run: grease examples/autogenerated/runtime-acceptance/prepare-host.grease
      - name: Restore exact pinned frontend bootstrap
        id: frontend_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          key: idric-740bbf2b1d9e811fd00c719c3473eede17ceea3b-ick-32cb45b3a3a257aeb07881c75f3b846495cfb2c9-ubuntu24-x86_64-v1
          path: |
            .tools/Idric/_/.tools
            .tools/Idric/_/bootstrap-build
            .tools/Idric/_/build
      - name: Build pinned frontend when not cached
        if: steps.frontend_cache.outputs.cache-hit != 'true'
        shell: sh
        env:
          CC: ${{ steps.ick.outputs.compiler }} -fno-link-libatomic
        run: .tools/Idric/edric bootstrap
      - name: Cache only the exact frontend bootstrap
        if: steps.frontend_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          key: ${{ steps.frontend_cache.outputs.cache-primary-key }}
          path: |
            .tools/Idric/_/.tools
            .tools/Idric/_/bootstrap-build
            .tools/Idric/_/build
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: 'build-tools;35.0.0 ndk;27.2.12479018'
      - name: Compile checked runtime fixtures and independently decode candidates
        shell: sh
        run: grease examples/autogenerated/runtime-acceptance/build.grease "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.tools/Idric" "$RUNNER_TEMP/runtime-repair"
      - name: Prepare emulator KVM access
        shell: sh
        run: grease -c 'sudo chmod 666 /dev/kvm'
      - name: Prepare checked JNI contracts with the qualified C driver
        shell: sh
        env:
          IDRIS2_PREFIX: ${{ github.workspace }}/.tools/Idric/_/bootstrap-build
          IDRIS2_PACKAGE_PATH: ${{ github.workspace }}/.tools/Idric/_/bootstrap-build/idris2-0.8.0
          IDRIS2_DATA: ${{ github.workspace }}/.tools/Idric/_/support
          IDRIS2_LIBS: ${{ github.workspace }}/.tools/Idric/_/support/c
          CHEZ: ${{ github.workspace }}/.tools/Idric/_/.tools/bin/scheme
        run: grease examples/autogenerated/runtime-acceptance/prepare-native.grease "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.tools/Idric" "$GITHUB_WORKSPACE/dex/idric/build/exec/idric-dex" "$RUNNER_TEMP/runtime-repair/oracles/baksmali.jar" "${{ steps.ick.outputs.compiler }}" "$ANDROID_HOME/ndk/27.2.12479018" "$RUNNER_TEMP/runtime-repair/native"
      - name: Execute checked candidates and reject changed-source mutant on ART
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          emulator-options: -no-window -no-audio -no-snapshot -no-boot-anim -memory 2048 -gpu swiftshader_indirect
          disable-animations: true
          script: |
            grease examples/autogenerated/runtime-acceptance/observe.grease "$ANDROID_HOME/platform-tools/adb" emulator-5554 "$RUNNER_TEMP/runtime-repair/candidates" "$RUNNER_TEMP/runtime-repair/art"
            grease examples/autogenerated/jni-contracts/observe.grease "$ANDROID_HOME/platform-tools/adb" emulator-5554 "$RUNNER_TEMP/runtime-repair/native" "$RUNNER_TEMP/runtime-repair/native-art"
      - name: Retain exact source, bytes, expectations and observed output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime-repair-api${{ matrix.api }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/runtime-repair
          if-no-files-found: warn
