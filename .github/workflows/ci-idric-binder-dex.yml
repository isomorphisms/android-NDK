name: Idriç Binder DEX

on:
  push:
    branches:
      - binder/idric-shizuku
  pull_request:

permissions:
  contents: read

concurrency:
  group: idric-binder-dex-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  binder-dex:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Android-NDK branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Checkout current Idriç compiler
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: isomorphisms/Idric
          ref: Idriç
          path: dex/idric/Idric

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl python3 util-linux default-jre-headless

      - name: Build public-NDK Binder façade
        run: |
          test -x "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi29-clang"
          make -C binder/ndk clean
          make -C binder/ndk ANDROID_NDK_HOME="$ANDROID_NDK_HOME" ABI=armeabi-v7a API=29
          make -C binder/ndk ANDROID_NDK_HOME="$ANDROID_NDK_HOME" ABI=arm64-v8a API=29
          test -s binder/ndk/build/armeabi-v7a/libidric_android_binder.so
          test -s binder/ndk/build/arm64-v8a/libidric_android_binder.so

      - name: Bootstrap exact Idriç checkout
        working-directory: dex/idric/Idric
        run: |
          ./edric all
          test -x build/exec/idris2
          build/exec/idris2 --version

      - name: Typecheck Idriç NDK Binder hooks
        working-directory: binder/idric
        run: |
          export IDRIS2_PATH="$GITHUB_WORKSPACE/dex/idric/Idric/_/libs/prelude/build/ttc"
          ../../dex/idric/Idric/build/exec/idris2 --typecheck idric-android-binder.ipkg

      - name: Typecheck DEX backend and Binder extension
        working-directory: dex/idric
        run: |
          IDRIC="$PWD/Idric/build/exec/idris2"
          make check IDRIC="$IDRIC" IDRIC_REPO="$PWD/Idric"

      - name: Regression-check existing DEX slices
        working-directory: dex/idric
        run: |
          IDRIC="$PWD/Idric/build/exec/idris2"
          make dex-fixture dex-text-validation dex-encoder-selftest \
            IDRIC="$IDRIC" IDRIC_REPO="$PWD/Idric"

      - name: Validate Binder framework DEX
        working-directory: dex/idric
        run: |
          IDRIC="$PWD/Idric/build/exec/idris2"
          make dex-framework-plan-test dex-framework-invoke-test dex-framework-validation \
            IDRIC="$IDRIC" IDRIC_REPO="$PWD/Idric"

      - name: Retain Binder DEX evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: idric-binder-dex-${{ github.sha }}
          path: |
            binder/ndk/build/
            dex/idric/build/exec/framework.dex
            dex/idric/build/exec/baksmali-framework/
          if-no-files-found: warn
          retention-days: 14
